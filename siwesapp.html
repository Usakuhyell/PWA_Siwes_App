<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="siwesapp.css" />
    <title>SIWES Showcase</title>
    <link rel="icon" type="image/png" href="cover.png" />
  </head>

  <body>
    <header>
      <h1>SIWES Showcase</h1>

      <nav>
        <a href="siwesapp.html">Home</a>
        <a href="#upload">Upload Yours</a>
      </nav>
    </header>

    <main>
      <section class="showcase">
        <h2>Student Projects</h2>

        <div class="cards" id="cards">
          <!-- cards -->
        </div>
      </section>

      <section class="upload-section" id="upload">
        <form class="uploadform" id="uploadform">
          <h2>Showcase Your SIWES</h2>

          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" />
          <span class="nameError"></span>

          <label for="description">Project Description</label>
          <textarea
            id="description"
            placeholder="Describe your project and what you learned..."
          ></textarea>
          <span class="descriptionError"></span>

          <label for="image">Project Image</label>
          <input type="file" id="image" accept="image/*" />
          <span class="imageError"></span>

          <button type="submit" id="submit">Upload Project</button>
        </form>
      </section>
    </main>

    <footer>
      <p>SIWES Showcase &copy; 2026</p>
      <span>Usakuhyell James Adamu</span>
      <span>2024/1/95104CP</span>
    </footer>
    <script src="siwesapp.js"></script>
  </body>
</html>
